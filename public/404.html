<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Page Not Found — SA Crown Web Design</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: #102b25;
        color: #f5ebd7;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 560px;
        padding: 40px 32px;
        background-color: #0b1f1b;
        border: 1px solid rgba(214, 182, 111, 0.3);
        border-radius: 2px;
      }
      .kicker {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #d6b66f;
      }
      h1 {
        margin: 14px 0 0;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 36px;
        line-height: 1.15;
        font-weight: 600;
        color: #f5ebd7;
      }
      p {
        margin: 16px 0 0;
        font-size: 15px;
        line-height: 1.65;
        color: rgba(245, 235, 215, 0.82);
      }
      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 12px 22px;
        background-color: #d6b66f;
        color: #102b25;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 2px;
      }
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 12px 20px;
        border: 1px solid rgba(245, 235, 215, 0.3);
        color: #f5ebd7;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="kicker">404 · Page Not Found</p>
      <h1>This page is no longer available.</h1>
      <p>
        The requested URL does not exist on SA Crown Web Design. Visit our studio homepage or
        explore our current web design services and portfolio work below.
      </p>
      <div class="actions">
        <a href="/" class="btn-primary">Return to Homepage</a>
        <a href="/#work" class="btn-secondary">Explore Our Work</a>
      </div>
    </main>
  </body>
</html>
